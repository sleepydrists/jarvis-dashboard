# Render Blueprint — JARVIS API backend
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: jarvis-api
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ALLOWED_ORIGINS
        sync: false
      - key: LEAD_WEBHOOK_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
    disk:
      name: jarvis-leads-data
      mountPath: /var/data
      sizeGB: 1
